name: plugin-v2-smoke

on:
  push:
    branches: [ main, master, "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  linux-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run plugin v2 smoke
        run: |
          bash tools/plugin_v2_smoke.sh

