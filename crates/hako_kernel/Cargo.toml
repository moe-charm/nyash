[package]
name = "hako_kernel"
version = "0.1.0"
edition = "2021"

[lib]
name = "hako_kernel"
crate-type = ["staticlib", "rlib"]

[dependencies]
nyash-rust = { path = "../../", default-features = false, features = ["plugins"] }


[features]
# Bootstrap set includes runtime+core collections (Array/Map/String)
default = ["core-runtime"]
core-runtime = []
core-collections = ["nyash-rust/static-array-plugin", "nyash-rust/static-map-plugin", "nyash-rust/static-string-plugin"]
core-io = ["nyash-rust/static-file-plugin", "nyash-rust/static-json-plugin"]
core-network = []
bootstrap = ["core-runtime", "core-collections"]
full = ["core-runtime", "core-collections", "core-io", "core-network"]
