[private]
# Phase 15.7: 最小の非公開パターン（警告モード）。モジュール経由の using を推奨し、直パス using を抑止。
patterns = [
  # Compiler internals（重要どころのみ）
  "apps/selfhost-compiler/pipeline_v2/stage1_*.hako",
  "apps/selfhost-compiler/pipeline_v2/emit_compare_box.hako",
  "apps/selfhost-compiler/pipeline_v2/json_minify_box.hako",
  "apps/selfhost-compiler/boxes/builder/**",
  "apps/selfhost-compiler/boxes/ssa/**",

  # VM internals（Mini‑VM 内部）
  "apps/selfhost/vm/boxes/mini_vm_*.hako",
  "apps/selfhost/vm/boxes/*_internal*.hako",

  # テスト・一時
  "apps/**/test_*.hako",
  "apps/**/_*.hako",
]

[private.options]
on_violation = "warn"          # 最初は警告のみ
enable_diagnostics = true       # 安定したJSON診断を1行で出す
