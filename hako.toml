[env]
# Put environment defaults used by tools or examples if needed
# Enable using resolver by default (can be disabled with NYASH_SKIP_TOML_ENV=1)
# Hakorune VM Phase 1 development: allow file path using
HAKO_USING = "1"
HAKO_USING_STRATEGY = "prelude"
HAKO_ALLOW_USING_FILE = "1"
HAKO_USING_PROFILE = "dev"
# Enable dev sugar preexpand for @ local alias (line-head) during parsing
HAKO_DEV_AT_LOCAL = "1"
# Macros: enable minimal macro engine and built-in selfhost micro macros (dev)
HAKO_MACRO_ENABLE = "1"
# Note: Macro PATHS are opt-in per test/profile to avoid argv overflows in child runner.
# Set NYASH_MACRO_PATHS in specific smokes or profiles as needed.
# Enable contracts checks by default (unborn guard/diagnostics)
NYASH_CHECK_CONTRACTS = "1"

[using]
paths = ["apps", "lib", "."]

# Optional package-style entries (opt-in via using resolver)
[using.json_native]
path = "apps/lib/json_native/"
main = "parser/parser.hako"

# JSON Native – String utilities as a standalone package (single-file)
[using.string_utils]
path = "apps/lib/json_native/utils/string.hako"

[using.aliases]
# Resolve `using json as ...` to json_native when desired
json = "json_native"
JsonNode = "json_node"

[using.json_node]
path = "apps/lib/json_native/core/node.hako"

[modules]
# Map logical namespaces to Nyash source paths (consumed by runner)
selfhost.common.json.mir_builder_min = "apps/selfhost/common/json/mir_builder_min.hako"
selfhost.common.json.mir_v1_adapter = "apps/selfhost/common/json/mir_v1_adapter.hako"
selfhost.core.timer = "core.timer.TimerBox"
timer = "core.timer.TimerBox"
hakorune.common.json.cursor = "apps/hakorune/common/json/json_cursor_alias.hako"
hakorune.common.json.frag = "apps/hakorune/common/json/json_frag_alias.hako"
hakorune.common.strings.helpers = "apps/hakorune/common/strings/string_helpers_alias.hako"

# json_native utility boxes (for resolver-friendly module references)
selfhost.json.utils.stringify_ops = "apps/lib/json_native/utils/stringify_ops_box.hako"
selfhost.json.utils.parse_ops = "apps/lib/json_native/utils/parse_ops_box.hako"
selfhost.json.utils.object_parse = "apps/lib/json_native/utils/object_parse_box.hako"
selfhost.json.utils.array_parse = "apps/lib/json_native/utils/array_parse_box.hako"

# Selfhost compiler main module (avoid file-path using in dev wrappers)
selfhost.compiler.main = "apps/selfhost-compiler/compiler.hako"

# Temporary alias keys (migration aid; keys kept stable)
# selfhost.common.json = "apps/selfhost/common/json_adapter.hako"

# Tools (dep_tree utilities)
selfhost.tools.dep_tree_core = "apps/selfhost/tools/dep_tree_core.hako"

# v2 Plugin libraries (loader reads these for TypeBox ABI)

# v2 sections — discovery + minimal aliases/overrides
[modules.options]
# Keep discovery enabled; roots default to apps (can extend per project)
enable_discovery = true
roots = ["apps"]
# Heuristic excludes (simple keywords; no glob engine)
exclude = [
  "**/archive/**",
  "**/_*/*",
  "**/test_*",
  "**/example_*",
]

[modules.aliases]
# Friendly short names pointing to discovered namespaces
selfhost.vm.entry = "selfhost.vm.boxes.mini_vm_entry"
hakorune.vm.entry = "hakorune.vm.boxes.hakorune_vm_entry"
selfhost.vm.mir_min = "selfhost.vm.boxes.mir_vm_min"
hakorune.vm.mir_min = "hakorune.vm.boxes.hakorune_vm_min"
selfhost.vm.handlers = "selfhost.vm.boxes.op_handlers"
selfhost.vm.scanner = "selfhost.vm.boxes.instruction_scanner"
selfhost.vm.prints = "selfhost.vm.boxes.mini_vm_prints"
selfhost.vm.json_cur = "selfhost.vm.boxes.json_cur"
selfhost.vm.core = "selfhost.vm.boxes.mini_vm_core"
selfhost.vm.seam = "selfhost.vm.boxes.seam_inspector"
selfhost.vm.json = "selfhost.common.json_adapter"
hakorune.vm.inst_scan = "hakorune.vm.boxes.inst_scan"
hakorune.vm.inst_value_scan = "hakorune.vm.boxes.inst_value_scan"
# Short alias
selfhost.core.timer = "core.timer.TimerBox"
timer = "core.timer.TimerBox"

